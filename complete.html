<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応募完了 | Example Careers</title>
</head>
<body>

<header>
  <h1>Example Careers</h1>
</header>

<main>
  <h2>応募ありがとうございました</h2>

  <p>
    応募を受け付けました。
  </p>

  <p id="job-info"></p>

  <a href="./index.html">TOPへ戻る</a>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job_id');

  let jobName = '';
  let jobCategory = '';

  if (jobId === '123') {
    jobName = '法人営業';
    jobCategory = '営業';
  } else if (jobId === '456') {
    jobName = 'Webエンジニア';
    jobCategory = 'エンジニア';
  }

  if (jobId) {
    document.getElementById('job-info').textContent =
      '応募求人ID：' + jobId;
  }

  window.dataLayer = window.dataLayer || [];

  dataLayer.push({
    event: 'apply_complete',
    job_id: jobId,
    job_name: jobName,
    job_category: jobCategory
  });
</script>

</body>
</html>
